[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
authors = [
    { name = "Andrey Grigoryev", email = "v314xm@users.noreply.github.com" },
]
name = "pcap-triage"
version = "1.0.0"
description = "PCAP triage pipeline for analysts"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
pcap-triage = "pcap_triage.cli:main"

[tool.setuptools.packages.find]
include = ["pcap_triage*"]

[tool.pytest.ini_options]
norecursedirs = ["tools", ".venv", "build", "dist", "__pycache__"]
